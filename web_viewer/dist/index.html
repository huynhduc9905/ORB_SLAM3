<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ORB-SLAM3 Remote Web Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; user-select: none; }
    #webgl-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      z-index: 10;
      pointer-events: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    #hud h1 { font-size: 14px; color: #38bdf8; margin-bottom: 6px; font-weight: 700; }
    #hud .stat { margin: 4px 0; color: #94a3b8; }
    #hud .stat span { color: #f1f5f9; font-weight: 600; }

    #controls {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    button {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:hover { background: #334155; color: #fff; }
    button:active { transform: scale(0.96); }
    button.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

    #camera-panel {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      aspect-ratio: 848 / 480;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }
    #camera-panel.minimized {
      width: 44px;
      height: 44px;
      aspect-ratio: auto;
      border-radius: 22px;
    }
    #camera-panel.minimized #camera-img,
    #camera-panel.minimized #overlay-canvas {
      display: none;
    }
    #camera-toggle {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      z-index: 12;
      cursor: pointer;
    }
    #camera-panel.minimized #camera-toggle {
      top: 8px;
      right: 8px;
      background: #0284c7;
      border-color: #38bdf8;
    }

    #camera-img { width: 100%; height: 100%; display: block; object-fit: fill; }
    #overlay-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Phone / Mobile Responsive layout */
    @media (max-width: 640px) {
      #hud {
        top: 10px;
        left: 10px;
        right: 10px;
        width: auto;
        padding: 8px 12px;
        font-size: 11px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2px 8px;
        border-radius: 10px;
      }
      #hud h1 {
        grid-column: span 2;
        font-size: 12px;
        margin-bottom: 2px;
      }
      #controls {
        bottom: 12px;
        left: 10px;
        top: auto;
        right: auto;
        padding: 4px;
        gap: 4px;
      }
      button {
        padding: 6px 10px;
        font-size: 11px;
        min-height: 36px;
      }
      #camera-panel {
        bottom: 60px;
        right: 10px;
        width: 180px;
        border-radius: 8px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/index-8EceRKgi.js"></script>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>

  <div id="hud">
    <h1>ORB-SLAM3 Web Visualizer</h1>
    <div class="stat">Status: <span id="stat-status">Connecting...</span></div>
    <div class="stat">Pose: <span id="stat-pose">N/A</span></div>
    <div class="stat">Tracked Keypoints: <span id="stat-kp">0</span></div>
    <div class="stat">Map Points: <span id="stat-points">0</span></div>
  </div>

  <div id="controls">
    <button id="btn-follow" class="active">Follow Cam</button>
    <button id="btn-top">Top View</button>
    <button id="btn-reset">Reset View</button>
  </div>

  <div id="camera-panel">
    <button id="camera-toggle" title="Toggle Camera Panel">📷</button>
    <img id="camera-img" alt="Camera Stream" />
    <canvas id="overlay-canvas"></canvas>
  </div>

</body>
</html>
